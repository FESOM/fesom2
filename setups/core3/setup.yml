mesh: core3
forcing: JRA55
clim:
    type: phc
    filelist: ['phc3.0_winter.nc','phc3.0_winter.nc']
    varlist: ['salt', 'temp']
ntasks: 512
time: "08:00:00"

namelist.config:
    run_config:
        use_cavity: True
    timestep:
        # Cold start: the CORE3 spin-up runs used 300 s for the first months
        # before switching to the default 1800 s (step_per_day: 48).
        step_per_day: 288
        run_length: 1
        run_length_unit: "y"
    restart_log:
        restart_length: 1
        restart_length_unit: "y"
