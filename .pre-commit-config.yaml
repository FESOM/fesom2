minimum_pre_commit_version: "3.2.0"

default_install_hook_types:
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: prohibit-ai-attribution
        name: Prohibit AI attribution
        entry: python3 tools/check_ai_attribution.py
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
